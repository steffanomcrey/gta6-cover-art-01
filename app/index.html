<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Heat — Key Art Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="studio">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Heat</h1>
    <p class="lede">Four big panels, one giant title. Your photo becomes key art.</p>
    <label>Your photo <input id="upload" type="file" accept="image/*"></label>
    <label>Layout
      <select id="layout"></select>
    </label>
    <label>Grade
      <select id="grade"></select>
    </label>
    <label>Title
      <input id="title" type="text" maxlength="24" value="VICE HEAT">
    </label>
    <label>Tagline
      <input id="tagline" type="text" maxlength="48" value="One last ride in Leonida">
    </label>
    <label>Post size
      <select id="size"></select>
    </label>
    <div id="presets" class="presets" aria-label="Cover ideas"></div>
    <div class="actions">
      <button id="surprise" type="button">Surprise me</button>
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
    </div>
    <div class="actions">
      <button id="export" type="button" class="primary">Export PNG</button>
      <button id="exportAll" type="button">Export all 3 sizes</button>
    </div>
    <p id="status" role="status">Pick a layout, type a title, export.</p>
    <section id="panels" class="panels" aria-label="Panel controls"></section>
    <p class="fine">Offline: photos stay on your machine. Fonts: Anton and Pacifico, SIL Open Font License.</p>
  </section>
  <section class="preview-wrap" aria-label="Live preview">
    <canvas id="preview" width="1080" height="1080"></canvas>
    <canvas id="shotCanvas" width="1080" height="1080" hidden></canvas>
  </section>
</main>
<script type="module">
  import { keyRunShot } from './src/studioShots.js';
  import { keyStartStudio } from './src/studioApp.js';
  const query = new URLSearchParams(location.search);
  const shot = query.get('shot');
  if (shot) {
    keyRunShot(shot, query).catch((err) => {
      document.getElementById('status').textContent = 'Shot failed: ' + err.message;
    });
  } else {
    keyStartStudio().catch((err) => {
      document.getElementById('status').textContent = 'Could not start: ' + err.message;
    });
  }
</script>
</body>
</html>
